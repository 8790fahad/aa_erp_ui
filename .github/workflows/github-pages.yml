name: Deploy Frontend to GitHub Pages

# Uses gh-pages branch deploy (peaceiris) instead of actions/deploy-pages.
# That path was stuck forever on deployment_queued for this repo.
#
# After first green run, set:
#   Settings → Pages → Source = "Deploy from a branch"
#   Branch = gh-pages / (root)
# Keep custom domain: ashiru-ali.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Custom domain serves from site root
      - name: Build
        env:
          GITHUB_PAGES: "false"
        run: npm run build

      - name: Add 404.html for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          cname: ashiru-ali.com
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
